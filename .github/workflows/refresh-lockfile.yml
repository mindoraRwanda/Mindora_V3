name: Refresh npm lockfile for dependency security updates

on:
  push:
    branches:
      - fix/password-reset-resend-sender-20261125
      - fix/appointment-schedule-migration-20261125
      - feat/clinical-workspace-api-20261125
    paths:
      - .github/workflows/refresh-lockfile.yml
      - package.json
      - apps/**/package.json
      - packages/**/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify security-patched dependency versions
        run: |
          node -e "const p=require('./package-lock.json').packages; for (const name of ['mongoose','zod','multer','joi','follow-redirects','fast-uri']) { const entries=Object.entries(p).filter(([k])=>k==='node_modules/'+name||k.endsWith('/node_modules/'+name)); console.log(name,entries.map(([k,v])=>k+'='+v.version).join(', ')); }"
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: refresh dependency lockfile"
          git push
