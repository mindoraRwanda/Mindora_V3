name: Format clinical workspace route

on:
  push:
    branches:
      - feat/clinical-workspace-api-20261125
    paths:
      - apps/user-service/src/routes/clinical-workspace.routes.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinical-workspace-api-20261125
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Format route
        run: npx prettier --write apps/user-service/src/routes/clinical-workspace.routes.ts
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/user-service/src/routes/clinical-workspace.routes.ts
          git diff --cached --quiet || git commit -m "style(clinical): format clinical workspace route"
          git push
