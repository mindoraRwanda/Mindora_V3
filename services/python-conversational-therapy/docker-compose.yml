services:
  postgres:
    image: postgres:15
    container_name: mindora_chatbot_postgres
    restart: unless-stopped
    ports:
      - "5100:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindora_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mindora_chatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindora_chatbot} -d ${POSTGRES_DB:-mindora_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: mindora_chatbot_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  chatbot-api:
    build: .
    container_name: mindora_chatbot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindora_chatbot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mindora_chatbot}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
