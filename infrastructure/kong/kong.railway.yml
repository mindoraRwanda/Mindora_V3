_format_version: '3.0'

# Railway variant of kong.yml (local dev). Same routes/plugins — the only
# difference is `url:` on each service, which points at the bundle app
# service's Railway private DNS instead of host.docker.internal. Kong's
# declarative config can't read env vars, so this file must be baked into
# the Kong image via infrastructure/kong/Dockerfile (COPY), not templated
# at runtime. The bundle service is named "Mindora_V3" on Railway, whose
# private DNS resolves as mindorav3.railway.internal — confirm this against
# the RAILWAY_PRIVATE_DOMAIN variable on that service's own Variables tab
# (Railway auto-injects it) if you rename the service or DNS still fails to
# resolve, and update every `url:` below to match.

# Global CORS. credentials: true is required because the frontend's
# apiFetch() uses credentials: 'include' (the httpOnly refreshToken cookie
# set by auth-service's /login rides along on it) — that means origins MUST
# be an explicit allowlist, never '*' (the CORS spec forbids a wildcard
# origin when credentials are allowed; same bug found and fixed in the local
# kong.yml, where it was live-confirmed via Kong's own /plugins admin API
# that '*' + credentials:true meant Kong reflected ANY request's Origin
# header — i.e. no real restriction at all). Add any other real frontend
# origins (a mobile app's web build, a staging domain) explicitly here as
# they come up — never reintroduce a wildcard alongside credentials: true.
plugins:
  - name: cors
    config:
      origins:
        - https://app.mindora.rw
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        [
          Accept,
          Accept-Version,
          Content-Length,
          Content-MD5,
          Content-Type,
          Date,
          Authorization,
          X-Auth-Token,
        ]
      exposed_headers: [X-Auth-Token]
      credentials: true
      max_age: 3600
      preflight_continue: false

services:
  - name: auth-service
    url: http://mindorav3.railway.internal:3001
  - name: user-service
    url: http://mindorav3.railway.internal:3002
  - name: appointment-service
    url: http://mindorav3.railway.internal:3003
  - name: mood-tracking-service
    url: http://mindorav3.railway.internal:3004
  - name: community-service
    url: http://mindorav3.railway.internal:3005
  - name: messaging-service
    url: http://mindorav3.railway.internal:3006
  - name: ai-integration-service
    url: http://mindorav3.railway.internal:3007
  - name: notification-service
    url: http://mindorav3.railway.internal:3008
  - name: admin-service
    url: http://mindorav3.railway.internal:3009

routes:
  # Public health checks (no JWT) — full path forwarded to each service
  - name: auth-health
    service: auth-service
    paths: [/api/v1/auth/health]
    strip_path: false
    methods: [GET]
  # Public auth endpoints — no JWT plugin (you can't present a token you
  # don't have yet to register/login/refresh/reset). Each route matches its
  # full exact path (needed so Kong can tell it apart from the JWT-protected
  # auth-api route sharing the same /api/v1/auth prefix) but forwards with
  # strip_path: false + a request-transformer rewrite, since strip_path on an
  # exact full-path match strips the entire URI, leaving nothing to route on
  # at the service.
  - name: auth-register
    service: auth-service
    paths: [/api/v1/auth/register]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /register
  - name: auth-login
    service: auth-service
    paths: [/api/v1/auth/login]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /login
  - name: auth-refresh
    service: auth-service
    paths: [/api/v1/auth/refresh]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /refresh
  - name: auth-forgot-password
    service: auth-service
    paths: [/api/v1/auth/forgot-password]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /forgot-password
  - name: auth-reset-password
    service: auth-service
    paths: [/api/v1/auth/reset-password]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /reset-password
  - name: auth-oauth-google
    service: auth-service
    paths: [/api/v1/auth/oauth/google]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /oauth/google
  - name: auth-oauth-google-callback
    service: auth-service
    paths: [/api/v1/auth/oauth/google/callback]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /oauth/google/callback
  - name: user-health
    service: user-service
    paths: [/api/v1/users/health]
    strip_path: false
    methods: [GET]
  - name: appointment-health
    service: appointment-service
    paths: [/api/v1/appointments/health]
    strip_path: false
    methods: [GET]
  - name: mood-health
    service: mood-tracking-service
    paths: [/api/v1/mood/health]
    strip_path: false
    methods: [GET]
  - name: community-health
    service: community-service
    paths: [/api/v1/community/health]
    strip_path: false
    methods: [GET]
  - name: messaging-health
    service: messaging-service
    paths: [/api/v1/messaging/health]
    strip_path: false
    methods: [GET]
  - name: ai-health
    service: ai-integration-service
    paths: [/api/v1/ai/health]
    strip_path: false
    methods: [GET]
  - name: notification-health
    service: notification-service
    paths: [/api/v1/notifications/health]
    strip_path: false
    methods: [GET]
  - name: admin-health
    service: admin-service
    paths: [/api/v1/admin/health]
    strip_path: false
    methods: [GET]

  # Protected API routes (JWT + rate limit)
  - name: auth-api
    service: auth-service
    paths: [/api/v1/auth]
    strip_path: true
    methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify: [exp]
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: user-api
    service: user-service
    paths: [/api/v1/users]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # Internal service-to-service lookup (e.g. community-service resolving post
  # authors). Not part of the public user-api route — requires a SERVICE-role
  # JWT, checked by user-service itself after Kong validates the signature.
  - name: user-internal
    service: user-service
    paths: [/internal/users]
    strip_path: false
    methods: [GET, PUT]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # Internal service-to-service lookup (e.g. user-service backfilling
  # role/email onto profile rows). Not part of the public auth-api route —
  # requires a SERVICE-role JWT, checked by auth-service itself after Kong
  # validates the signature. Same pattern as user-internal above.
  - name: auth-internal
    service: auth-service
    paths: [/internal/auth]
    strip_path: false
    methods: [GET, PATCH]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: appointment-api
    service: appointment-service
    paths: [/api/v1/appointments]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 150
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's platform
  # analytics aggregation). Same SERVICE-role-only pattern as user-internal
  # and auth-internal above.
  - name: appointment-internal
    service: appointment-service
    paths: [/internal/appointments]
    strip_path: false
    methods: [GET]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: mood-api
    service: mood-tracking-service
    paths: [/api/v1/mood]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's platform
  # analytics aggregation). Same SERVICE-role-only pattern as user-internal
  # and auth-internal above.
  - name: mood-internal
    service: mood-tracking-service
    paths: [/internal/mood]
    strip_path: false
    methods: [GET]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: community-api
    service: community-service
    # strip_path: false — community-service mounts its router at
    # app.use('/api/v1/community', communityRoutes), so it expects the full
    # path, not the stripped remainder. strip_path: true here 404s every
    # public community route through the gateway ('Cannot POST /groups').
    paths: [/api/v1/community]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's moderation
  # queue). Same SERVICE-role-only pattern as user-internal/auth-internal.
  - name: community-internal
    service: community-service
    paths: [/internal/community]
    strip_path: false
    methods: [GET, PUT]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: messaging-api
    service: messaging-service
    # strip_path: false — messaging-service mounts its router at
    # app.use('/api/v1/messaging/conversations', conversationsRouter), so it
    # expects the full path, not the stripped remainder. strip_path: true
    # here 404s every route through the gateway (same bug found and fixed
    # in the local kong.yml — confirmed live there via 'Cannot GET
    # /conversations').
    paths: [/api/v1/messaging]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 500
          policy: local

  # Proxies messaging-service's Socket.io endpoint. Deploying this bundle
  # (step 3 of DP.md) gives only Kong a public domain — without this route,
  # the frontend's real-time chat has no way to reach messaging-service at
  # all in production (confirmed: no public messaging domain exists, and
  # this route was simply never added). No jwt plugin here, unlike every
  # other route above: Socket.io's own handshake auth (see
  # authenticateHandshake in apps/messaging-service/src/socket.ts) carries
  # the token inside the Engine.io connect payload, not as a discoverable
  # Authorization header or query param Kong's jwt plugin could check —
  # the socket layer verifies it itself, the same way the REST layer's own
  # `authenticate` middleware does for the jwt-plugin'd routes above.
  - name: messaging-socket
    service: messaging-service
    paths: [/socket.io]
    strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          policy: local

  - name: ai-api
    service: ai-integration-service
    # strip_path: false — ai-integration-service mounts its router at
    # app.use('/api/v1/ai', aiRouter), so its routes expect the full path
    # (e.g. GET /api/v1/ai/usage), not the stripped remainder Kong would
    # otherwise forward. strip_path: true here 404s every route through
    # the gateway (confirmed: 'Cannot GET /usage').
    paths: [/api/v1/ai]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  - name: notification-api
    service: notification-service
    # strip_path: false — notifications.routes.ts registers its one route at
    # the full literal path (GET /api/v1/notifications/logs) even though the
    # router is mounted at app root. strip_path: true here 404s it through
    # the gateway (same bug found and fixed in the local kong.yml).
    paths: [/api/v1/notifications]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: admin-api
    service: admin-service
    paths: [/api/v1/admin]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: local

consumers:
  - username: mindora-platform

jwt_secrets:
  - consumer: mindora-platform
    key: mindora-auth
    # Must match the app service's actual production JWT_SECRET exactly.
    # Kong's declarative config does not expand env vars, so this can't be
    # `${{...}}` — paste the real secret value here before building the
    # Kong image, and never commit the real value to this file in a public
    # repo (keep this repo private, or manage this file outside of git).
    secret: mindora-dev-jwt-secret-change-in-production
