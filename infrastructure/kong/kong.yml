_format_version: '3.0'

# Single Kong config for every environment.
#
# There used to be a second copy of this file (kong.railway.yml) that differed
# only in the upstream host. The two drifted: the Railway one kept
# `origins: ['*']` with credentials enabled, and a committed JWT secret that
# had to be pasted in by hand before building the image. Both are now
# ${PLACEHOLDER}s substituted at container start by docker-entrypoint.sh, so
# there is one file and the environment-specific values are deployment config.
#
# ${KONG_UPSTREAM_HOST} is the only thing that varies by environment:
#   local (docker compose) : host.docker.internal — services run on the host
#   Railway                : mindorav3.railway.internal — the bundle service's
#                            private DNS. Confirm against RAILWAY_PRIVATE_DOMAIN
#                            on that service's Variables tab if it's renamed.

services:
  - name: auth-service
    url: http://${KONG_UPSTREAM_HOST}:3001
  - name: user-service
    url: http://${KONG_UPSTREAM_HOST}:3002
  - name: appointment-service
    url: http://${KONG_UPSTREAM_HOST}:3003
  - name: mood-tracking-service
    url: http://${KONG_UPSTREAM_HOST}:3004
  - name: community-service
    url: http://${KONG_UPSTREAM_HOST}:3005
  - name: messaging-service
    url: http://${KONG_UPSTREAM_HOST}:3006
  - name: ai-integration-service
    url: http://${KONG_UPSTREAM_HOST}:3007
  - name: notification-service
    url: http://${KONG_UPSTREAM_HOST}:3008
  - name: admin-service
    url: http://${KONG_UPSTREAM_HOST}:3009
  - name: docs-gateway
    url: http://${KONG_UPSTREAM_HOST}:3010

routes:
  # Public health checks (no JWT) — full path forwarded to each service
  - name: auth-health
    service: auth-service
    paths: [/api/v1/auth/health]
    strip_path: false
    methods: [GET, OPTIONS]
  # Public auth endpoints — no JWT plugin (you can't present a token you
  # don't have yet to register/login/refresh/reset). Each route matches its
  # full exact path (needed so Kong can tell it apart from the JWT-protected
  # auth-api route sharing the same /api/v1/auth prefix) but forwards with
  # strip_path: false + a request-transformer rewrite, since strip_path on an
  # exact full-path match strips the entire URI, leaving nothing to route on
  # at the service (was: 404 "Cannot POST /" — see BACKEND_COMPLETE.md).
  - name: auth-register
    service: auth-service
    paths: [/api/v1/auth/register]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /register
  - name: auth-login
    service: auth-service
    paths: [/api/v1/auth/login]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /login
  - name: auth-refresh
    service: auth-service
    paths: [/api/v1/auth/refresh]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /refresh
  - name: auth-forgot-password
    service: auth-service
    paths: [/api/v1/auth/forgot-password]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /forgot-password
  - name: auth-reset-password
    service: auth-service
    paths: [/api/v1/auth/reset-password]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /reset-password
  - name: auth-oauth-google
    service: auth-service
    paths: [/api/v1/auth/oauth/google]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /oauth/google
  - name: auth-oauth-google-callback
    service: auth-service
    paths: [/api/v1/auth/oauth/google/callback]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /oauth/google/callback
  - name: user-health
    service: user-service
    paths: [/api/v1/users/health]
    strip_path: false
    methods: [GET, OPTIONS]
  # Therapist profile photos — public like health, no JWT plugin. An <img>
  # tag can't send an Authorization header, so this can't sit behind the
  # jwt-protected user-api route below.
  - name: user-photos
    service: user-service
    paths: [/api/v1/users/photos]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: appointment-health
    service: appointment-service
    paths: [/api/v1/appointments/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: mood-health
    service: mood-tracking-service
    paths: [/api/v1/mood/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: community-health
    service: community-service
    paths: [/api/v1/community/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: messaging-health
    service: messaging-service
    paths: [/api/v1/messaging/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: ai-health
    service: ai-integration-service
    paths: [/api/v1/ai/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: notification-health
    service: notification-service
    paths: [/api/v1/notifications/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: admin-health
    service: admin-service
    paths: [/api/v1/admin/health]
    strip_path: false
    methods: [GET, OPTIONS]

  # Aggregated Swagger UI. No jwt plugin on purpose: a browser loading the
  # docs page can't attach a Bearer token, so gating it here would just make
  # it unreachable. It exposes the shape of every endpoint (not data) — if
  # that's not acceptable in production, drop this route rather than adding
  # jwt, and reach the docs through the service's own port instead.
  # strip_path: true because docs-gateway mounts Swagger UI at '/'.
  - name: docs-gateway-api
    service: docs-gateway
    paths: [/docs]
    strip_path: true
    methods: [GET, OPTIONS]

  # Protected API routes (JWT + rate limit)
  - name: auth-api
    service: auth-service
    paths: [/api/v1/auth]
    strip_path: true
    methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify: [exp]
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: user-api
    service: user-service
    paths: [/api/v1/users]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # Internal service-to-service lookup (e.g. community-service resolving post
  # authors). Not part of the public user-api route — requires a SERVICE-role
  # JWT, checked by user-service itself after Kong validates the signature.
  - name: user-internal
    service: user-service
    paths: [/internal/users]
    strip_path: false
    methods: [GET, PUT, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # Internal service-to-service lookup (e.g. user-service backfilling
  # role/email onto profile rows). Not part of the public auth-api route —
  # requires a SERVICE-role JWT, checked by auth-service itself after Kong
  # validates the signature. Same pattern as user-internal above.
  - name: auth-internal
    service: auth-service
    paths: [/internal/auth]
    strip_path: false
    methods: [GET, PATCH, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: appointment-api
    service: appointment-service
    paths: [/api/v1/appointments]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 150
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's platform
  # analytics aggregation). Same SERVICE-role-only pattern as user-internal
  # and auth-internal above.
  - name: appointment-internal
    service: appointment-service
    paths: [/internal/appointments]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: mood-api
    service: mood-tracking-service
    paths: [/api/v1/mood]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's platform
  # analytics aggregation). Same SERVICE-role-only pattern as user-internal
  # and auth-internal above.
  - name: mood-internal
    service: mood-tracking-service
    paths: [/internal/mood]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: community-api
    service: community-service
    # strip_path: false — pre-existing bug found while live-testing the new
    # moderation feature: community-service mounts its router at
    # app.use('/api/v1/community', communityRoutes), so it expects the full
    # path, not the stripped remainder. strip_path: true here 404s every
    # public community route through the gateway ('Cannot POST /groups') —
    # unrelated to anything in this task, but it blocked verification of the
    # E2E report -> moderate flow, and the test suite never caught it since
    # it hits Express directly via supertest, bypassing Kong entirely.
    paths: [/api/v1/community]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's moderation
  # queue). Same SERVICE-role-only pattern as user-internal/auth-internal.
  - name: community-internal
    service: community-service
    paths: [/internal/community]
    strip_path: false
    methods: [GET, PUT, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: messaging-api
    service: messaging-service
    # strip_path: false — same mismatch already fixed for community-api and
    # ai-api above: messaging-service mounts at the full gateway path
    # (app.use('/api/v1/messaging/conversations', ...), and likewise for
    # /api/v1/messaging/presence/:userId), so it expects the whole path rather
    # than the stripped remainder. strip_path: true 404s every messaging route
    # through the gateway (confirmed: 'Cannot GET /conversations'), which
    # surfaces in the UI as a chat that will not open. The test suite can't
    # catch it — supertest hits Express directly and never crosses Kong.
    paths: [/api/v1/messaging]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 500
          policy: local

  - name: ai-api
    service: ai-integration-service
    # strip_path: false — ai-integration-service mounts its router at
    # app.use('/api/v1/ai', aiRouter), so its routes expect the full path
    # (e.g. GET /api/v1/ai/usage), not the stripped remainder Kong would
    # otherwise forward. strip_path: true here 404s every route through
    # the gateway (confirmed: 'Cannot GET /usage').
    paths: [/api/v1/ai]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  - name: notification-api
    service: notification-service
    # strip_path: false — fourth instance of the mismatch fixed for
    # community-api, ai-api and messaging-api. notification-service mounts its
    # router at the root (app.use(notificationsRouter)) but bakes the full path
    # into the route itself, notificationsRouter.get('/api/v1/notifications/logs'),
    # so it still expects the whole path. strip_path: true forwarded '/logs'
    # and 404'd ('Cannot GET /logs').
    #
    # Worth noting for future audits: reading only the app.use() mounts misses
    # this shape, because the prefix lives on the route rather than the mount.
    # scripts/smoke-gateway.mjs checks the behaviour instead of the wiring.
    paths: [/api/v1/notifications]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: admin-api
    service: admin-service
    paths: [/api/v1/admin]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: local

# Global — applies to every route above. The frontend lives on a separate
# origin, so browser requests through the gateway need real CORS headers.
# credentials: true is required because apiFetch() uses
# credentials: 'include' (the HttpOnly refresh-token cookie) — and that in
# turn means origins MUST be an explicit allowlist: the CORS spec forbids a
# wildcard origin when credentials are allowed.
#
# NOTE: this file previously declared `plugins:` twice (a '*'-origin block at
# the top and this one). YAML forbids duplicate keys — strict parsers reject
# the file outright, and Kong's lenient parser silently kept only the last
# block, so the '*' block never did anything. Keep exactly one `plugins:` key.
#
# ${...} placeholders are substituted at container start by
# infrastructure/kong/docker-entrypoint.sh; Kong's declarative config has no
# native env-var expansion.
plugins:
  - name: cors
    config:
      origins: ${KONG_CORS_ORIGINS}
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
      preflight_continue: false

consumers:
  - username: mindora-platform

jwt_secrets:
  - consumer: mindora-platform
    key: mindora-auth
    # Substituted from the JWT_SECRET env var at container start — must match
    # the value the services sign with. Never commit a real secret here.
    secret: ${JWT_SECRET}
