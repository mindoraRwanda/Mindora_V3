_format_version: '3.0'

# Microservices run on the host during local dev (npm run dev).
# Kong in Docker reaches them via host.docker.internal.

services:
  - name: auth-service
    url: http://host.docker.internal:3001
  - name: user-service
    url: http://host.docker.internal:3002
  - name: appointment-service
    url: http://host.docker.internal:3003
  - name: mood-tracking-service
    url: http://host.docker.internal:3004
  - name: community-service
    url: http://host.docker.internal:3005
  - name: messaging-service
    url: http://host.docker.internal:3006
  - name: ai-integration-service
    url: http://host.docker.internal:3007
  - name: notification-service
    url: http://host.docker.internal:3008
  - name: admin-service
    url: http://host.docker.internal:3009

routes:
  # Public health checks (no JWT) — full path forwarded to each service
  - name: auth-health
    service: auth-service
    paths: [/api/v1/auth/health]
    strip_path: false
    methods: [GET]
  # Public auth endpoints — no JWT plugin (you can't present a token you
  # don't have yet to register/login/refresh/reset). Each route matches its
  # full exact path (needed so Kong can tell it apart from the JWT-protected
  # auth-api route sharing the same /api/v1/auth prefix) but forwards with
  # strip_path: false + a request-transformer rewrite, since strip_path on an
  # exact full-path match strips the entire URI, leaving nothing to route on
  # at the service (was: 404 "Cannot POST /" — see BACKEND_COMPLETE.md).
  - name: auth-register
    service: auth-service
    paths: [/api/v1/auth/register]
    strip_path: false
    methods: [POST]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /register
  - name: auth-login
    service: auth-service
    paths: [/api/v1/auth/login]
    strip_path: false
    methods: [POST]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /login
  - name: auth-refresh
    service: auth-service
    paths: [/api/v1/auth/refresh]
    strip_path: false
    methods: [POST]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /refresh
  - name: auth-forgot-password
    service: auth-service
    paths: [/api/v1/auth/forgot-password]
    strip_path: false
    methods: [POST]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /forgot-password
  - name: auth-reset-password
    service: auth-service
    paths: [/api/v1/auth/reset-password]
    strip_path: false
    methods: [POST]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /reset-password
  - name: auth-oauth-google
    service: auth-service
    paths: [/api/v1/auth/oauth/google]
    strip_path: false
    methods: [GET]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /oauth/google
  - name: auth-oauth-google-callback
    service: auth-service
    paths: [/api/v1/auth/oauth/google/callback]
    strip_path: false
    methods: [GET]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /oauth/google/callback
  - name: user-health
    service: user-service
    paths: [/api/v1/users/health]
    strip_path: false
    methods: [GET]
  - name: appointment-health
    service: appointment-service
    paths: [/api/v1/appointments/health]
    strip_path: false
    methods: [GET]
  - name: mood-health
    service: mood-tracking-service
    paths: [/api/v1/mood/health]
    strip_path: false
    methods: [GET]
  - name: community-health
    service: community-service
    paths: [/api/v1/community/health]
    strip_path: false
    methods: [GET]
  - name: messaging-health
    service: messaging-service
    paths: [/api/v1/messaging/health]
    strip_path: false
    methods: [GET]
  - name: ai-health
    service: ai-integration-service
    paths: [/api/v1/ai/health]
    strip_path: false
    methods: [GET]
  - name: notification-health
    service: notification-service
    paths: [/api/v1/notifications/health]
    strip_path: false
    methods: [GET]
  - name: admin-health
    service: admin-service
    paths: [/api/v1/admin/health]
    strip_path: false
    methods: [GET]

  # Protected API routes (JWT + rate limit)
  - name: auth-api
    service: auth-service
    paths: [/api/v1/auth]
    strip_path: true
    methods: [GET, POST, PUT, PATCH, DELETE]
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify: [exp]
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: user-api
    service: user-service
    paths: [/api/v1/users]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # Internal service-to-service lookup (e.g. community-service resolving post
  # authors). Not part of the public user-api route — requires a SERVICE-role
  # JWT, checked by user-service itself after Kong validates the signature.
  - name: user-internal
    service: user-service
    paths: [/internal/users]
    strip_path: false
    methods: [GET]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # Internal service-to-service lookup (e.g. user-service backfilling
  # role/email onto profile rows). Not part of the public auth-api route —
  # requires a SERVICE-role JWT, checked by auth-service itself after Kong
  # validates the signature. Same pattern as user-internal above.
  - name: auth-internal
    service: auth-service
    paths: [/internal/auth]
    strip_path: false
    methods: [GET]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: appointment-api
    service: appointment-service
    paths: [/api/v1/appointments]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 150
          policy: local

  - name: mood-api
    service: mood-tracking-service
    paths: [/api/v1/mood]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  - name: community-api
    service: community-service
    paths: [/api/v1/community]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: messaging-api
    service: messaging-service
    paths: [/api/v1/messaging]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 500
          policy: local

  - name: ai-api
    service: ai-integration-service
    paths: [/api/v1/ai]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  - name: notification-api
    service: notification-service
    paths: [/api/v1/notifications]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: admin-api
    service: admin-service
    paths: [/api/v1/admin]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: local

consumers:
  - username: mindora-platform

jwt_secrets:
  - consumer: mindora-platform
    key: mindora-auth
    # Must match JWT_SECRET in .env — Kong declarative config does not expand env vars
    secret: mindora-dev-jwt-secret-change-in-production
