_format_version: '3.0'

# Microservices run on the host during local dev (npm run dev).
# Kong in Docker reaches them via host.docker.internal.

services:
  - name: auth-service
    url: http://host.docker.internal:3001
  - name: user-service
    url: http://host.docker.internal:3002
  - name: appointment-service
    url: http://host.docker.internal:3003
  - name: mood-tracking-service
    url: http://host.docker.internal:3004
  - name: community-service
    url: http://host.docker.internal:3005
  - name: messaging-service
    url: http://host.docker.internal:3006
  - name: ai-integration-service
    url: http://host.docker.internal:3007
  - name: notification-service
    url: http://host.docker.internal:3008
  - name: admin-service
    url: http://host.docker.internal:3009

routes:
  # Public health checks (no JWT) — full path forwarded to each service
  - name: auth-health
    service: auth-service
    paths: [/api/v1/auth/health]
    strip_path: false
    methods: [GET, OPTIONS]
  # Public auth endpoints — no JWT plugin (you can't present a token you
  # don't have yet to register/login/refresh/reset). Each route matches its
  # full exact path (needed so Kong can tell it apart from the JWT-protected
  # auth-api route sharing the same /api/v1/auth prefix) but forwards with
  # strip_path: false + a request-transformer rewrite, since strip_path on an
  # exact full-path match strips the entire URI, leaving nothing to route on
  # at the service (was: 404 "Cannot POST /" — see BACKEND_COMPLETE.md).
  - name: auth-register
    service: auth-service
    paths: [/api/v1/auth/register]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /register
  - name: auth-login
    service: auth-service
    paths: [/api/v1/auth/login]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /login
  - name: auth-refresh
    service: auth-service
    paths: [/api/v1/auth/refresh]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /refresh
  - name: auth-forgot-password
    service: auth-service
    paths: [/api/v1/auth/forgot-password]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /forgot-password
  - name: auth-reset-password
    service: auth-service
    paths: [/api/v1/auth/reset-password]
    strip_path: false
    methods: [POST, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /reset-password
  - name: auth-oauth-google
    service: auth-service
    paths: [/api/v1/auth/oauth/google]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /oauth/google
  - name: auth-oauth-google-callback
    service: auth-service
    paths: [/api/v1/auth/oauth/google/callback]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /oauth/google/callback
  - name: user-health
    service: user-service
    paths: [/api/v1/users/health]
    strip_path: false
    methods: [GET, OPTIONS]
  # Therapist profile photos — public like health, no JWT plugin. An <img>
  # tag can't send an Authorization header, so this can't sit behind the
  # jwt-protected user-api route below.
  - name: user-photos
    service: user-service
    paths: [/api/v1/users/photos]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: appointment-health
    service: appointment-service
    paths: [/api/v1/appointments/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: mood-health
    service: mood-tracking-service
    paths: [/api/v1/mood/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: community-health
    service: community-service
    paths: [/api/v1/community/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: messaging-health
    service: messaging-service
    paths: [/api/v1/messaging/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: ai-health
    service: ai-integration-service
    paths: [/api/v1/ai/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: notification-health
    service: notification-service
    paths: [/api/v1/notifications/health]
    strip_path: false
    methods: [GET, OPTIONS]
  - name: admin-health
    service: admin-service
    paths: [/api/v1/admin/health]
    strip_path: false
    methods: [GET, OPTIONS]

  # Protected API routes (JWT + rate limit)
  - name: auth-api
    service: auth-service
    paths: [/api/v1/auth]
    strip_path: true
    methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify: [exp]
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: user-api
    service: user-service
    paths: [/api/v1/users]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # Internal service-to-service lookup (e.g. community-service resolving post
  # authors). Not part of the public user-api route — requires a SERVICE-role
  # JWT, checked by user-service itself after Kong validates the signature.
  - name: user-internal
    service: user-service
    paths: [/internal/users]
    strip_path: false
    methods: [GET, PUT, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # Internal service-to-service lookup (e.g. user-service backfilling
  # role/email onto profile rows). Not part of the public auth-api route —
  # requires a SERVICE-role JWT, checked by auth-service itself after Kong
  # validates the signature. Same pattern as user-internal above.
  - name: auth-internal
    service: auth-service
    paths: [/internal/auth]
    strip_path: false
    methods: [GET, PATCH, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: appointment-api
    service: appointment-service
    paths: [/api/v1/appointments]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 150
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's platform
  # analytics aggregation). Same SERVICE-role-only pattern as user-internal
  # and auth-internal above.
  - name: appointment-internal
    service: appointment-service
    paths: [/internal/appointments]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: mood-api
    service: mood-tracking-service
    paths: [/api/v1/mood]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 200
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's platform
  # analytics aggregation). Same SERVICE-role-only pattern as user-internal
  # and auth-internal above.
  - name: mood-internal
    service: mood-tracking-service
    paths: [/internal/mood]
    strip_path: false
    methods: [GET, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: community-api
    service: community-service
    # strip_path: false — pre-existing bug found while live-testing the new
    # moderation feature: community-service mounts its router at
    # app.use('/api/v1/community', communityRoutes), so it expects the full
    # path, not the stripped remainder. strip_path: true here 404s every
    # public community route through the gateway ('Cannot POST /groups') —
    # unrelated to anything in this task, but it blocked verification of the
    # E2E report -> moderate flow, and the test suite never caught it since
    # it hits Express directly via supertest, bypassing Kong entirely.
    paths: [/api/v1/community]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  # Internal service-to-service lookup (e.g. admin-service's moderation
  # queue). Same SERVICE-role-only pattern as user-internal/auth-internal.
  - name: community-internal
    service: community-service
    paths: [/internal/community]
    strip_path: false
    methods: [GET, PUT, OPTIONS]
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 300
          policy: local

  - name: messaging-api
    service: messaging-service
    # strip_path: false — same class of bug as community-api/ai-api above:
    # messaging-service mounts its router at
    # app.use('/api/v1/messaging/conversations', conversationsRouter), so it
    # expects the full path. strip_path: true here 404s every route through
    # the gateway (confirmed: 'Cannot GET /conversations').
    paths: [/api/v1/messaging]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 500
          policy: local

  # Proxies messaging-service's Socket.io endpoint through Kong — mirrors
  # kong.railway.yml's route of the same name, which is load-bearing there
  # (only Kong gets a public domain in production; without this route the
  # frontend's real-time chat has no public path to messaging-service at
  # all). Not needed locally (the frontend can reach messaging-service's own
  # exposed port directly, see NEXT_PUBLIC_SOCKET_URL in the frontend's
  # .env.example), but kept here too so this path is exercised in local
  # testing rather than only ever running for the first time in production.
  # No jwt plugin: Socket.io's handshake auth carries the token in the
  # Engine.io connect payload, not a header/query param Kong could check —
  # see authenticateHandshake in apps/messaging-service/src/socket.ts.
  - name: messaging-socket
    service: messaging-service
    paths: [/socket.io]
    strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          policy: local

  - name: ai-api
    service: ai-integration-service
    # strip_path: false — ai-integration-service mounts its router at
    # app.use('/api/v1/ai', aiRouter), so its routes expect the full path
    # (e.g. GET /api/v1/ai/usage), not the stripped remainder Kong would
    # otherwise forward. strip_path: true here 404s every route through
    # the gateway (confirmed: 'Cannot GET /usage').
    paths: [/api/v1/ai]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  - name: notification-api
    service: notification-service
    # strip_path: false — same class of bug as community-api/ai-api/
    # messaging-api above: notifications.routes.ts registers its one route at
    # the full literal path (GET /api/v1/notifications/logs) even though the
    # router is mounted at app root. strip_path: true here 404s it through
    # the gateway (confirmed: 'Cannot GET /logs').
    paths: [/api/v1/notifications]
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: admin-api
    service: admin-service
    paths: [/api/v1/admin]
    strip_path: true
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 100
          policy: local

# Global — applies to every route above. The frontend now lives in a
# separate repo/origin (e.g. http://localhost:3000) instead of being served
# same-origin from this monorepo, so browser requests through the gateway
# need real CORS headers. credentials: true is required because apiFetch()
# uses credentials: 'include' (the HttpOnly refresh-token cookie) — that
# means origins must be an explicit allowlist, never '*' (the CORS spec
# forbids a wildcard origin when credentials are allowed). Add any other
# frontend origins (deployed URL, alternate dev ports, a mobile app's web
# build) to this list as they come up.
#
# NOTE: this used to be a second, duplicate top-level `plugins:` key
# alongside an earlier wildcard-origin CORS block — YAML silently keeps only
# one map value for a repeated key, so only the wildcard block (the *other*
# one) was actually ever loaded by Kong, meaning this allowlist was never in
# effect. Confirmed via `GET /plugins` on Kong's admin API. Merged into this
# single block; if the mobile app's web build still needs to call the API
# from an unpredictable dev origin, add that origin explicitly rather than
# reintroducing a wildcard alongside credentials: true.
plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        # Next.js falls back to this port when 3000 is already taken by
        # something else on the machine (observed during a local QA pass).
        - http://localhost:3010
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600
      preflight_continue: false

consumers:
  - username: mindora-platform

jwt_secrets:
  - consumer: mindora-platform
    key: mindora-auth
    # Must match JWT_SECRET in .env — Kong declarative config does not expand env vars
    secret: mindora-dev-jwt-secret-change-in-production
